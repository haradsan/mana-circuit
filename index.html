<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>マナサーキット — カード×ボード対戦</title>
<!-- ?v= はキャッシュ避け。スマホのブラウザは css/js を強く握り続けるため、
     更新したら必ずこの番号を上げること（上げないと端末に古い版が残り続ける） -->
<link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>
<header>
  <h1>✦ マナサーキット ✦</h1>
  <!-- v28: ヘッダーは「常に横一行」に収める。ズーム枠はゲーム中だけ出し（タイトルでは無意味）、
       🗑捨札は下の #view-toggles（📜ログ・🗺マップと同列）へ移した -->
  <div class="header-right">
    <div id="zoom-ctrl" title="盤面を拡大／縮小（Ctrl+マウスホイール・2本指ピンチでも可）">
      <button id="zoom-out" class="btn small" title="盤面を縮小">－</button>
      <button id="zoom-label" class="btn small" title="等倍に戻す">100%</button>
      <button id="zoom-in" class="btn small" title="盤面を拡大">＋</button>
      <button id="zoom-fit" class="btn small" title="盤面全体が画面に収まる倍率に調整する">⛶<span class="lbl"> 全体</span></button>
    </div>
    <button id="surrender-btn" class="btn small danger hidden" title="自分の番でダイスを振る前にゲームを投了できます">🏳<span class="lbl"> 投了</span></button>
    <button id="mute-btn" class="btn small" title="効果音のオン/オフ">🔊</button>
    <button id="bgm-btn" class="btn small" title="BGMのオン/オフ（ファミコン風チップチューンを自動生成）">🎵</button>
    <button id="help-btn" class="btn small" title="遊び方">❓<span class="lbl"> 遊び方</span></button>
  </div>
</header>

<!-- 上部固定の情報エリア（v27）: 盤面に「重ねない」ためフロー配置にしてある。
     ・#pstrips  … プレイヤー3名分の圧縮情報窓（👥で表示/非表示・クリックで詳細）
     ・#hud-bar  … 対戦情報（ステージ/ラウンド/首位）＋メッセージ＋表示トグル -->
<div id="hud-top">
  <div id="pstrips">
    <div class="pstrip" id="panel-0"></div>
    <div class="pstrip" id="panel-1"></div>
    <!-- 3人目（⚔三つ巴のときだけ表示。それ以外は .unused で非表示） -->
    <div class="pstrip unused" id="panel-2"></div>
  </div>
  <div id="hud-bar">
    <div id="round-info"></div>
    <div id="message">ようこそ</div>
    <!-- v28: 🃏手札トグルは親指の届く操作ドック（ダイスの上）へ移動。
         代わりに🗑捨札をここへ入れ、「見るための窓」を1列にまとめた -->
    <div id="view-toggles">
      <button id="view-panels" class="vt" title="上部の情報窓（3名分）を表示／非表示">👥</button>
      <button id="view-log" class="vt" title="📜ログを表示／非表示">📜</button>
      <button id="view-map" class="vt" title="🗺 マップ確認モード（情報窓・ログ・手札を一時的に隠してマス目を優先表示）">🗺</button>
      <button id="discard-btn" class="vt" title="両者の捨てカードを確認する">🗑</button>
    </div>
  </div>
</div>

<main>
  <div id="board-wrap">
    <div id="board-inner">
      <svg id="board" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <!-- 📜ログ: 広い画面では盤面の右に並べて「盤面に重ねない」。狭い画面だけ左下のフローティングになる -->
  <div id="win-log" class="hud-win"><div id="log"></div><button class="win-close" title="一時的に隠す（👥📜のトグルで戻せます）">✕</button></div>
</main>

<!-- 下段: 手札 ＋ 操作ドック（ダイス）。ここもフロー配置＝盤面に重ならない -->
<div id="bottom-bar">
  <div id="win-hand" class="hud-win framed">
    <div class="win-head"><span id="hand-count"></span></div>
    <!-- 手札は矢印ボタンで1枚ずつ送れる（スマホでスワイプすると戻るジェスチャーと衝突するため） -->
    <div id="hand-row">
      <button id="hand-prev" class="hand-arrow hidden" title="手札を左へ送る">◀</button>
      <div id="hand"></div>
      <button id="hand-next" class="hand-arrow hidden" title="手札を右へ送る">▶</button>
    </div>
    <button class="win-close" title="一時的に隠す（🃏のトグルで戻せます）">✕</button>
  </div>
  <!-- 操作ドック（v27）: 盤面中央にあった 🎲 と操作ボタンをここへ集約。
       ダイスは「出目の表示」と「振るボタン」を同じ丸い場所に重ねてある -->
  <div id="ctrl-dock">
    <button id="action-btn" class="btn primary hidden"></button>
    <!-- v28: 🃏手札の開閉はダイスのすぐ上。手札を畳んで盤面を見る→すぐ戻す、が片手で完結する -->
    <button id="view-hand" class="vt dock-vt" title="🃏手札を大きく／小さく（折りたたみ）">🃏</button>
    <div id="dice-slot" title="直前の出目">
      <div id="dice">🎲</div>
      <button id="roll-btn" class="hidden" title="ダイスを振る（Space / Enter キーでも振れます）">
        <span class="rb-face">🎲</span><span class="rb-lbl">振る</span>
      </button>
    </div>
  </div>
</div>

<!-- ポップアップ通知（ui.js toast）: スペルの効果・機能停止など「影響のあった出来事」を
     画面上部に短く出してすぐ消す。📜ログを閉じて遊んでいても気づけるようにするため。
     pointer-events:none なので盤面やダイアログの操作を邪魔しない -->
<div id="toast-stack"></div>

<div id="overlay">
  <div id="dialog"></div>
</div>

<!-- バトルのカットイン演出（フルスクリーン・⏩でスキップ可）。中身は openBattleView が生成する -->
<div id="battle-cutin" class="hidden"></div>

<!-- ダイアログを一旦閉じて盤面/手札を確認しているときに表示する「選択に戻る」ボタン -->
<button id="peek-restore" class="hidden">▲ 選択ウインドウに戻る</button>

<script src="js/sfx.js?v=34"></script>
<script src="js/bgm.js?v=34"></script>
<script src="js/profile.js?v=34"></script>
<script src="js/cards.js?v=34"></script>
<script src="js/styles.js?v=34"></script>
<script src="js/art.js?v=34"></script>
<script src="js/stages.js?v=34"></script>
<script src="js/chars.js?v=34"></script>
<script src="js/weekly.js?v=34"></script>
<script src="js/state.js?v=34"></script>
<script src="js/battle.js?v=34"></script>
<script src="js/ai.js?v=34"></script>
<script src="js/ui.js?v=34"></script>
<script src="js/collection.js?v=34"></script>
<script src="js/main.js?v=34"></script>
</body>
</html>
